name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # если ваша ветка называется "master", замените на "master"

# Эта строка переключает окружение на Node.js 24, убирая предупреждение
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5        # ✅ обновлено с v4 до v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v6   # ✅ обновлено с v4 до v6
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5            # ✅ обновлено с v4 до v5
