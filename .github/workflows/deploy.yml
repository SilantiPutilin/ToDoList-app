name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]   # если ваша основная ветка называется "master", замените на "master"

# Подавляем предупреждения о Node.js 20 и принудительно используем Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5        # обновлено до v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20               # можно оставить 20 или поднять до 22
      - run: npm ci
      - run: npm run build               # собирает проект в папку build (не dist)
      - uses: actions/upload-pages-artifact@v6   # обновлено до v6
        with:
          path: ./build                  # изменено с ./dist на ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v5    # обновлено до v5
