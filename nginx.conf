server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Прокси для Bored API.
    # Сервер bored-api.appbrewery.com не отдаёт заголовок Access-Control-Allow-Origin,
    # поэтому браузер блокирует прямой запрос со страницы (CORS). Nginx выполняет
    # запрос сам и возвращает ответ с того же origin, что и приложение.
    location /api/bored/ {
        # Имя хоста указано без переменной: nginx резолвит его один раз при старте
        # через системный DNS контейнера (/etc/resolv.conf). Вариант с переменной
        # требует директивы resolver, а встроенный DNS Docker (127.0.0.11)
        # доступен только в пользовательских сетях, но не в default bridge.
        proxy_pass https://bored-api.appbrewery.com/;

        # Передаём правильное имя хоста и SNI, иначе TLS-соединение будет отклонено
        proxy_set_header Host bored-api.appbrewery.com;
        proxy_ssl_server_name on;

        # Не пересылаем заголовок Origin, чтобы API не отвечал как на кросс-доменный запрос
        proxy_set_header Origin "";

        proxy_http_version 1.1;
    }

    # Одностраничное приложение: любой неизвестный путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статику из сборки Vite можно кэшировать надолго — имена файлов содержат хэш
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
